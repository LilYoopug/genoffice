name: Build Debian ARM Release

# Run this workflow manually to build and release Debian ARM package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-debian-arm:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner - no cross-compilation needed
    timeout-minutes: 60
    env:
      GENOFFICE_RELEASE_VERSION: ${{ github.event.inputs.version }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev libuuid1

      - name: Install Node dependencies
        run: npm ci

      - name: Build all frontend modules
        run: npm run build:all

      - name: Generate third-party notices
        run: npm run notices

      - name: Build xlsx-sidecar (native ARM64)
        run: |
          cd apps/sheets/native/xlsx-engine
          cargo build --release

      - name: Build Debian ARM package
        run: npm run dist:linux

      - name: List build artifacts
        run: |
          find release -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" | sort
          ls -la release/

      - name: Upload Debian ARM artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: GenOffice v${{ github.event.inputs.version }} (Debian ARM)
          body: |
            Automatic build of GenOffice Debian ARM package.
            
            This release contains:
            - genoffice_${{ github.event.inputs.version }}_arm64.deb
            
            Built from commit ${{ github.sha }} on native ARM64 runner
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/genoffice_${{ github.event.inputs.version }}_arm64.deb