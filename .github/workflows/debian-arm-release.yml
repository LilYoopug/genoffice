name: Build Debian ARM Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-debian-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GENOFFICE_RELEASE_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev libuuid1

      - name: Install Node deps
        run: npm ci

      - name: Build all frontend modules
        run: npm run build:all

      - name: Generate third-party notices
        run: npm run notices

      - name: Build xlsx-sidecar (native ARM64)
        run: |
          cd apps/sheets/native/xlsx-engine
          cargo build --release

      - name: Patch electron-builder config for ARM64 only
        run: node scripts/patch-electron-builder-arm64.js

      - name: Build Debian ARM package
        run: npm run dist:linux -w @genoffice/shell

      - name: List build artifacts
        run: |
          ls -la apps/shell/release/
          find apps/shell/release -name "*.deb" | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: GenOffice v${{ github.event.inputs.version }} (Debian ARM)
          body: |
            Automatic build of GenOffice Debian ARM package.

            - genoffice_${{ github.event.inputs.version }}_arm64.deb
            - Built from commit ${{ github.sha }} on native ARM64 runner
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apps/shell/release/genoffice_${{ github.event.inputs.version }}_arm64.deb